<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hearthglance Wall</title>
<link rel="stylesheet" href="wall.css">
<script type="module" src="wall.js"></script>
</head>
<body data-state="{{state}}" data-interval="{{interval}}">
<main id="home" class="home">
  <div class="clock"><time id="time"></time><div id="date"></div></div>
  <div id="actions" class="actions">{{actions}}</div>
  <p id="connection" class="connection" role="status" hidden>Reconnecting…</p>
</main>
<section id="slideshow" class="slideshow" hidden aria-label="Family Photos slideshow" aria-roledescription="slideshow">
  <img class="slide" alt="" decoding="async">
  <img class="slide" alt="" decoding="async">
  <p class="slideshow-empty" hidden>No photos yet. Add some from Sidekick.</p>
  <p class="slideshow-hint">Tap to return</p>
</section>
</body>
</html>
