<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171e1c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hearthglance"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hearthglance</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./app.css">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

</head><body>
<main id="app"></main><section id="login" hidden><img src="./icon.svg" width="64" height="64" alt=""><h1>Hearthglance</h1><p>Your family, at a glance.</p><a class="button" href="./auth/login" target="_top">Sign in with Home Assistant</a><button id="install-login" class="secondary" type="button" hidden>Add to Home Screen</button><p id="login-error" role="alert"></p></section>

<div id="install-help" hidden><section role="dialog" aria-modal="true" aria-labelledby="install-title" tabindex="-1"><h2 id="install-title">Install Hearthglance</h2><div id="install-instructions"></div><button id="install-close" class="button" type="button">Done</button></section></div>

<noscript>Enable JavaScript to open Hearthglance.</noscript>
</body></html>
