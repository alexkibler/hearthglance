Hearthglance: &hearthglance
  primary-color: "#326b5b"
  accent-color: "#326b5b"
  primary-font-family: "Arial, Helvetica, sans-serif"
  ha-font-family-body: "Arial, Helvetica, sans-serif"
  ha-font-family-heading: "Arial, Helvetica, sans-serif"
  ha-card-border-radius: "18px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  ha-section-border-radius: "18px"
  ha-view-sections-column-gap: "24px"
  ha-view-sections-row-gap: "24px"
  hearthglance-font-family: "Arial, Helvetica, sans-serif"
  modes:
    light:
      primary-background-color: "#f6f7f4"
      secondary-background-color: "#eaf1eb"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      primary-text-color: "#263c3b"
      secondary-text-color: "#73817e"
      divider-color: "#e5eae4"
      ha-card-border-color: "#e5eae4"
      app-header-background-color: "#ffffff"
      app-header-text-color: "#263c3b"
      sidebar-background-color: "#ffffff"
      sidebar-text-color: "#73817e"
      sidebar-selected-background-color: "#eaf1eb"
      sidebar-selected-text-color: "#326b5b"
      sidebar-icon-color: "#73817e"
      sidebar-selected-icon-color: "#326b5b"
      hearthglance-background: "#f6f7f4"
      hearthglance-surface: "#ffffff"
      hearthglance-ink: "#263c3b"
      hearthglance-muted: "#73817e"
      hearthglance-line: "#e5eae4"
      hearthglance-accent: "#326b5b"
      hearthglance-soft: "#eaf1eb"
      hearthglance-color-scheme: "light"
    dark: &hearthglance_dark
      primary-color: "#9dc6a3"
      accent-color: "#9dc6a3"
      primary-background-color: "#171e1c"
      secondary-background-color: "#35483a"
      card-background-color: "#222d28"
      ha-card-background: "#222d28"
      primary-text-color: "#e8ede6"
      secondary-text-color: "#a8b5a9"
      divider-color: "#364239"
      ha-card-border-color: "#364239"
      app-header-background-color: "#222d28"
      app-header-text-color: "#e8ede6"
      sidebar-background-color: "#222d28"
      sidebar-text-color: "#a8b5a9"
      sidebar-selected-background-color: "#35483a"
      sidebar-selected-text-color: "#9dc6a3"
      sidebar-icon-color: "#a8b5a9"
      sidebar-selected-icon-color: "#9dc6a3"
      hearthglance-background: "#171e1c"
      hearthglance-surface: "#222d28"
      hearthglance-ink: "#e8ede6"
      hearthglance-muted: "#a8b5a9"
      hearthglance-line: "#364239"
      hearthglance-accent: "#9dc6a3"
      hearthglance-soft: "#35483a"
      hearthglance-color-scheme: "dark"

# Choose this variant as the backend default to keep every HA page dark,
# including displays whose operating system requests a light appearance.
Hearthglance Dark:
  <<: *hearthglance
  modes:
    dark: *hearthglance_dark
